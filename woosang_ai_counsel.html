<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root {
  --navy-900: #0D1B2A;
  --navy-800: #152238;
  --navy-700: #1D3752;
  --navy-600: #24405C;
  --gold: #39D97A;
  --gold-light: #6FEBA3;
  --gold-dim: #1B7A4C;
  --cream: #F5F8FB;
  --cream-card: #ffffff;
  --ivory-border: #E4E9F0;
  --text-dark: #101828;
  --text-mid: #475467;
  --text-light: #e8ecf2;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100vh;
  overflow: hidden;
}
body {
  font-family: 'Pretendard', -apple-system, sans-serif;
  background: radial-gradient(circle at 20% 10%, #152238 0%, #0D1B2A 55%, #0A1420 100%);
  display: flex;
  flex-direction: column;
}

.app-shell {
  flex: 1;
  display: flex;
  justify-content: center;
  overflow: hidden;
  min-height: 0;
  padding: 18px;
}
.app-inner {
  width: 100%;
  max-width: 1000px;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 16px 50px rgba(120,90,40,0.16);
}

.header {
  background: var(--cream);
  color: var(--text-dark);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--ivory-border);
}
.header-icon {
  width: 44px; height: 44px;
  background: var(--navy-900);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.header-icon img {
  width: 68%; height: 68%;
  object-fit: contain;
}
.header-info h1 {
  font-family: 'Pretendard', -apple-system, sans-serif;
  font-size: 18px; font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--navy-800);
}
.header-info p { font-size: 12px; color: var(--text-mid); margin-top: 3px; letter-spacing: 0.2px; }
.online-badge {
  margin-left: auto;
  background: rgba(34,197,94,0.12);
  border: 1px solid rgba(34,197,94,0.45);
  color: #16a34a;
  font-size: 11px; font-weight: 500;
  padding: 5px 12px; border-radius: 20px;
  white-space: nowrap;
}

.chat-area {
  flex: 1; overflow-y: auto;
  min-height: 0;
  padding: 24px 18px;
  display: flex; flex-direction: column; gap: 14px;
  width: 100%;
}
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(201,164,92,0.3); border-radius: 10px; }

.msg { display: flex; gap: 10px; align-items: flex-end; }
.msg.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.msg.bot .msg-avatar {
  background: var(--navy-900);
  overflow: hidden;
}
.msg.bot .msg-avatar img {
  width: 72%; height: 72%;
  object-fit: contain;
}
.msg.user .msg-avatar { background: var(--navy-600); }
.msg-bubble {
  max-width: 78%; padding: 16px 20px;
  border-radius: 16px; font-size: 16.5px; line-height: 1.8;
}
.msg-bubble p { margin: 0; }
.msg-bubble p + p { margin-top: 10px; }
.msg.bot .msg-bubble {
  background: var(--cream-card);
  border: 1px solid var(--ivory-border);
  color: var(--text-dark);
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}
.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--navy-600), var(--navy-700));
  color: #fff;
  border-bottom-right-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.choices { display: flex; flex-wrap: wrap; gap: 9px; padding: 4px 0 4px 44px; }
.choice-btn {
  background: var(--cream-card);
  border: 1.5px solid var(--gold);
  color: var(--navy-800);
  padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.choice-btn:hover { background: var(--gold); color: #fff; border-color: var(--gold); }

.result-card {
  max-width: 100%;
  background: var(--cream-card);
  border: 1px solid var(--ivory-border);
  border-radius: 16px;
  padding: 22px 22px 18px;
  margin-left: 44px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}
.result-card + .result-card { margin-top: 4px; }
.result-title {
  font-family: 'Pretendard', -apple-system, sans-serif;
  color: var(--navy-800);
  font-size: 15px; font-weight: 700;
  letter-spacing: 0.3px;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--ivory-border);
}
.result-title::before { content: ''; width: 4px; height: 14px; background: var(--gold); border-radius: 2px; display: inline-block; }

.summary-grid { display: flex; flex-direction: column; gap: 6px; }
.summary-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 11px 4px;
  border-bottom: 1px solid #F0F3F7;
  font-size: 15px;
}
.summary-row:last-child { border-bottom: none; }
.summary-label { color: var(--text-mid); font-weight: 500; flex-shrink: 0; min-width: 100px; }
.summary-value { color: var(--text-dark); text-align: right; font-weight: 600; }

.stars { letter-spacing: 2px; font-size: 18px; color: var(--gold); }
.stars .dim { color: #D8E5DE; }

.grade-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%;
  font-family: 'Pretendard', -apple-system, sans-serif; font-weight: 700; font-size: 16px;
  border: 1.5px solid var(--gold);
  color: var(--gold-light);
  background: #E7F9EE;
}

.opinion-block, .check-block {
  font-size: 15px; line-height: 1.85; color: var(--text-dark);
  background: #F5F8FB;
  border-left: 2px solid var(--gold);
  padding: 12px 16px; border-radius: 6px;
  margin-top: 4px;
}
.check-block ul { padding-left: 18px; margin-top: 4px; }
.check-block li { margin-bottom: 3px; }

.reserve-banner {
  margin-top: 16px; padding: 14px 16px;
  background: #E7F9EE;
  border: 1px solid var(--gold);
  border-radius: 10px;
  text-align: center; font-size: 13px; color: var(--text-dark);
  line-height: 1.7;
}
.reserve-banner b { color: var(--navy-800); }
.reserve-banner a { color: var(--navy-800); text-decoration: none; font-weight: 700; }

.privacy-notice {
  margin: 8px 0 4px 44px;
  max-width: calc(100% - 44px);
  background: #F5F8FB;
  border: 1px dashed var(--gold);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--text-mid);
}
.privacy-notice b { color: var(--navy-800); }
@media (max-width: 480px) {
  .privacy-notice { margin-left: 0; max-width: 100%; font-size: 11.5px; }
}

.input-area {
  background: var(--cream-card);
  padding: 16px 20px;
  border-top: 1px solid var(--ivory-border);
  display: flex; gap: 10px; align-items: flex-end;
  width: 100%;
}
.input-area textarea {
  flex: 1;
  background: var(--cream-card);
  border: 1.5px solid var(--ivory-border);
  border-radius: 30px; padding: 14px 22px;
  font-size: 16px; resize: none; outline: none;
  font-family: inherit; max-height: 100px;
  color: var(--text-dark);
  transition: border-color 0.2s;
}
.input-area textarea::placeholder { color: #7A8699; }
.input-area textarea:focus { border-color: var(--gold); }
.send-btn {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--navy-700), var(--navy-900));
  border: none; border-radius: 50%;
  color: #fff; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s;
  flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(15,33,66,0.3);
}
.send-btn:hover { transform: scale(1.05); }
.send-btn:disabled { background: #c9c2b0; cursor: not-allowed; box-shadow: none; }

.typing { display: flex; gap: 5px; align-items: center; padding: 12px 16px; }
.typing span { width: 7px; height: 7px; background: var(--gold-dim); border-radius: 50%; animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

.call-bar {
  background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-dim));
  color: #fff;
  text-align: center; padding: 13px;
  font-size: 14px;
  font-weight: 500;
}
.call-bar a {
  color: var(--navy-900);
  text-decoration: none; font-weight: 700;
  background: rgba(255,255,255,0.5);
  padding: 3px 10px;
  border-radius: 20px;
}

.footer {
  background: var(--cream-card);
  padding: 9px; text-align: center;
  font-size: 11.5px; color: #5A6478; font-weight: 500;
}

@media (max-width: 480px) {
  .header { padding: 14px 16px; gap: 10px; }
  .header-icon { width: 38px; height: 38px; font-size: 18px; }
  .header-info h1 { font-size: 15px; }
  .header-info p { font-size: 10px; }
  .online-badge { font-size: 10px; padding: 4px 8px; }
  .chat-area { padding: 16px 10px; gap: 10px; }
  .msg-bubble { max-width: 85%; font-size: 14px; padding: 11px 14px; }
  .result-card { margin-left: 0; padding: 16px; }
  .choices { padding: 4px 0; }
  .input-area textarea { font-size: 16px; }
  .call-bar { font-size: 12px; padding: 8px; }
}
</style>
</head>

function starsHtml(n) {
  n = Math.max(1, Math.min(5, parseInt(n) || 3));
  let html = '<span class="stars">';
  for (let i = 0; i < 5; i++) {
    html += i < n ? '★' : '<span class="dim">★</span>';
  }
  html += '</span>';
  return html;
}

function calcMonthlyPayment(rows) {
  const minLiving = {
    0: 1538543,
    1: 2520105,
    2: 3211916,
    3: 3906688,
    4: 4590000
  };

  let income = 0, family = 0, adjustedFamily = 0, propertyText = '', debtText = '';

  function parseMoney(text) {
    text = String(text || '').replace(/,/g, '');
    const rangeMan = text.match(/(\d+(?:\.\d+)?)\s*[~\-]\s*(\d+(?:\.\d+)?)\s*만/);
    if (rangeMan) return ((parseFloat(rangeMan[1]) + parseFloat(rangeMan[2])) / 2) * 10000;
    const man = text.match(/(\d+(?:\.\d+)?)\s*만/);
    if (man) return parseFloat(man[1]) * 10000;
    const nums = text.match(/\d+/g);
    if (!nums) return 0;
    const joined = nums.join('');
    const n = parseInt(joined, 10);
    return n < 10000 ? n * 10000 : n;
  }

  rows.forEach(r => {
    const label = r.label || '';
    const value = r.value || '';
    if (label.includes('소득')) income = parseMoney(value);
    if (label.includes('부양가족')) {
      const m = value.match(/(\d+)/);
      if (m) family = Math.min(parseInt(m[1], 10), 4);
    }
    if (label.includes('재산')) propertyText = value;
    if (label.includes('채무')) debtText = value;
  });

  if (!income) return null;

  adjustedFamily = Math.max(0, family - 1);
  const living = minLiving[adjustedFamily] || minLiving[0];
  const simpleLeft = income - living;

  let low, high;
  if (income < 1500000) {
    low = 0;
    high = Math.max(150000, Math.round(income * 0.12));
  } else if (simpleLeft > 0) {
    low = Math.max(200000, Math.round(simpleLeft * 0.45));
    high = Math.max(low + 100000, Math.round(simpleLeft * 0.9));
  } else {
    low = Math.max(150000, Math.round(income * 0.08));
    high = Math.max(low + 150000, Math.round(income * 0.18));
  }

  const hasProperty = propertyText && !propertyText.includes('없음');
  if (hasProperty) {
    low = Math.round(low * 1.15);
    high = Math.round(high * 1.35);
  }

  const propertyNotice = hasProperty
    ? '부동산·차량·예금 등 재산이 있는 경우에는 청산가치가 반영되어 월 변제금이 증가하거나 변제기간에 영향을 줄 수 있습니다.'
    : '재산이 거의 없거나 적은 경우에도 채무 규모, 소득자료, 부양가족 인정 여부에 따라 월 변제금은 달라질 수 있습니다.';

  return { income, living, simpleLeft, low, high, family, adjustedFamily, propertyText, debtText, hasProperty, propertyNotice };
}

const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbygXwjSNlQ2dq8t_-38MCFgbjendBHIQFx_TBXIeeEV3IfUUgJpINJrAMCanJF2WANEoA/exec';

function saveToGoogleSheet(rows, analysis) {
  try {
    const findValue = (keyword, exclude) => {
      const r = rows.find(r => r.label.includes(keyword) && (!exclude || !r.label.includes(exclude)));
      return r ? r.value : '';
    };

    const phone = findValue('연락처');
    const income = findValue('소득');
    const debt = findValue('채무', '발생');
    const seizure = findValue('압류');

    const labelSet = rows.map(r => r.label).join(',');
    let type = '기타';
    if (labelSet.includes('채권자 수')) type = '개인회생';
    else if (labelSet.includes('면책 이력')) type = '개인파산';
    else if (labelSet.includes('피해자')) type = '형사';
    else if (labelSet.includes('혼인 기간')) type = '이혼·가사';
    else if (labelSet.includes('사건 종류')) type = '민사';

    const content = rows.map(r => `${r.label}: ${r.value}`).join(' / ');
    const review = analysis && analysis.opinion ? analysis.opinion : '';

    const now = new Date();
    const timestamp = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

    fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ timestamp, phone, type, income, debt, seizure, content, review })
    }).catch(err => console.error('[구글 시트 저장 실패]', err));

    // gtag가 아직 로드되지 않았을 경우 최대 3초 대기 후 재시도
    const fireGtag = (retry) => {
      if (typeof gtag === 'function') {
        gtag('event', 'conversion', {
          'send_to': 'AW-18280729484/WIDJCIvy48gcEIyX94xE',
          'value': 1.0,
          'currency': 'KRW'
        });
      } else if (retry > 0) {
        setTimeout(() => fireGtag(retry - 1), 500);
      }
    };
    fireGtag(6); // 500ms × 6 = 최대 3초 대기

    // 카카오픽셀도 동일하게 대기 후 발화
    const fireKakao = (retry) => {
      if (typeof kakaoPixel === 'function') {
        kakaoPixel('495453379544024998').completeRegistration();
      } else if (retry > 0) {
        setTimeout(() => fireKakao(retry - 1), 500);
      }
    };
    fireKakao(6);
  } catch (err) {
    console.error('[구글 시트 저장 오류]', err);
  }
}

function renderResultCards(rawText) {
  const area = document.getElementById('chatArea');

  const summaryMatch = rawText.match(/\[\[SUMMARY_START\]\]([\s\S]*?)\[\[SUMMARY_END\]\]/);
  const analysisMatch = rawText.match(/\[\[ANALYSIS_START\]\]([\s\S]*?)\[\[ANALYSIS_END\]\]/);

  let summaryRowsForSheet = null;
  let analysisForSheet = null;

  if (summaryMatch) {
    const rows = summaryMatch[1].trim().split('\n').filter(Boolean).map(line => {
      const [label, ...rest] = line.split('|');
      return { label: (label||'').trim(), value: rest.join('|').trim() };
    });
    summaryRowsForSheet = rows;

    const isRecovery = rows.some(r => r.label.includes('채권자') || r.label.includes('연체') || r.label.includes('압류'));
    let monthlyRow = '';
    if (isRecovery) {
      const calc = calcMonthlyPayment(rows);
      if (calc) {
        const fmt = n => Math.round(n/10000).toLocaleString() + '만 원';
        const rangeText = calc.low <= 0 ? '변호사 검토 필요' : `약 ${fmt(calc.low)} ~ ${fmt(calc.high)}`;
        const simpleText = calc.simpleLeft > 0
          ? `참고 계산상 월 납부에 사용할 수 있는 금액은 약 ${fmt(calc.simpleLeft)}입니다.`
          : '참고 계산만으로는 월 납부 가능 금액이 적거나 없을 수 있습니다.';
        monthlyRow = `

                <span style="font-weight:800; color:var(--gold-light); font-size:16px;">${rangeText}</span>
              </div>
              <div style="font-size:12px; color:#5A6478; line-height:1.7; margin-top:4px;">
                ✔ 월 소득, 부양가족, 채무 규모, 추가 생계비 인정 여부, 재산 보유 현황을 종합적으로 검토합니다.<br>
                ✔ ${escapeHtml(calc.propertyNotice)}<br>
                ※ 위 금액은 상담 전 참고 범위이며, 정확한 월 변제금은 자료 확인 후 변호사 검토로 산정됩니다.
              </div>
            </div>
          </div>`;
      }
    }

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="result-title">상담 내용 요약</div>
      <div class="summary-grid">
        ${rows.map(r => `<div class="summary-row"><span class="summary-label">${escapeHtml(r.label)}</span><span class="summary-value">${escapeHtml(r.value)}</span></div>`).join('')}
        ${monthlyRow}
      </div>
    `;
    area.appendChild(card);
  }

  if (analysisMatch) {
    const lines = analysisMatch[1].trim().split('\n').filter(Boolean);
    let stars = 3, grade = 'B', opinion = '', check = [];
    lines.forEach(line => {
      const idx = line.indexOf('|');
      if (idx === -1) return;
      const key = line.slice(0, idx).trim();
      const val = line.slice(idx + 1).trim();
      if (key === 'STARS') stars = val;
      else if (key === 'GRADE') grade = val;
      else if (key === 'OPINION') opinion = val;
      else if (key === 'CHECK') check = val.split(',').map(s => s.trim()).filter(Boolean);
    });
    analysisForSheet = { stars, grade, opinion, check };

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="result-title">법률 상황 체크리스트</div>
      <div class="summary-grid">
        <div class="summary-row"><span class="summary-label">검토 가능성</span><span class="summary-value">${starsHtml(stars)}</span></div>
        <div class="summary-row"><span class="summary-label">상담 난이도</span><span class="summary-value"><span class="grade-badge">${escapeHtml(grade)}</span></span></div>
      </div>
      <div style="margin-top:14px;">
        <div class="summary-label" style="margin-bottom:6px;">참고 안내</div>
        <div style="font-size:12px; color:#888; margin-bottom:6px;">※ 아래 내용은 법률적 판단이 아닌 참고용 안내입니다. 정확한 법률 검토는 반드시 변호사 상담을 통해 받으시기 바랍니다.</div>
        <div class="opinion-block">${escapeHtml(opinion)}</div>
      </div>
      ${check.length ? `
      <div style="margin-top:12px;">
        <div class="summary-label" style="margin-bottom:6px;">추가 확인 사항</div>
        <div class="check-block"><ul>${check.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul></div>
      </div>` : ''}
      <div class="reserve-banner">
        무료 상담 예약을 원하시면 <b>'상담예약'</b>이라고 입력해주세요.<br>
        우상법률사무소 ☎ <a href="tel:02-927-9665">02-927-9665</a>
      </div>
    `;
    area.appendChild(card);
  }

  const docsMatch = rawText.match(/\[\[DOCS_START\]\]([\s\S]*?)\[\[DOCS_END\]\]/);
  if (docsMatch) {
    const rows = docsMatch[1].trim().split('\n').filter(Boolean).map(line => {
      const idx = line.indexOf('|');
      if (idx === -1) return null;
      return { label: line.slice(0, idx).trim(), value: line.slice(idx+1).trim() };
    }).filter(Boolean);
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <div class="result-title">📋 준비 서류 안내</div>
      <div class="summary-grid">
        ${rows.map(r => `<div class="summary-row"><span class="summary-label">${escapeHtml(r.label)}</span><span class="summary-value" style="text-align:left; font-weight:400; color:var(--text-mid);">${escapeHtml(r.value)}</span></div>`).join('')}
      </div>
      <div style="margin-top:10px; font-size:12px; color:#999;">※ 위 서류는 일반적인 안내이며, 실제 필요 서류는 사건에 따라 달라질 수 있습니다.</div>
    `;
    area.appendChild(card);
  }

  if (summaryRowsForSheet) {
    saveToGoogleSheet(summaryRowsForSheet, analysisForSheet);
  }

  area.scrollTop = area.scrollHeight;
  return !!(summaryMatch || analysisMatch || docsMatch);
}

function addChoices(choices, disableInput = true) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'choices';
  div.id = 'choices';

  if (disableInput) {
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    input.disabled = true;
    input.placeholder = '위 버튼 중 하나를 선택해주세요';
    input.style.opacity = '0.5';
    sendBtn.disabled = true;
  }

  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => {
      document.getElementById('choices')?.remove();
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      input.disabled = false;
      input.placeholder = '메시지를 입력하세요...';
      input.style.opacity = '1';
      sendBtn.disabled = false;

      document.getElementById('userInput').value = c;
      sendMessage();
    };
    div.appendChild(btn);
  });
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">⚖️</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  document.getElementById('typing')?.remove();
}

function buildPreviewResult(fieldName, field, phone) {

  const phoneIdx = field.labels.length - 1;
  rows[phoneIdx] = { label: field.labels[phoneIdx], value: phone };

  const summary = rows.map(r => `${r.label}|${r.value}`).join('\n');

  let stars = 3, grade = 'B', opinion = '', check = '';

    check = '계약서 또는 문자 자료,이체 내역,상대방 인적사항,상대방 재산 현황';
  } else if (fieldName === '형사') {

    check = '사건 발생 일시,상대방 인적사항,증거 자료,경찰 조사 일정,진술 내용';
  } else {

    check = '배우자의 동의 여부,재산 목록 상세 내역,자녀 양육 현황,별거 여부';
  }

  let docs = '';
  if (fieldName === '개인회생') {
    docs = `\n[[DOCS_START]]\n신분증 사본|주민등록증 또는 운전면허증\n주민등록등본|최근 3개월 이내 발급\n가족관계증명서|최근 3개월 이내 발급\n소득 증빙 서류|급여명세서, 원천징수영수증, 매출장부 등\n채무 내역서|대출 잔액 확인서, 카드 이용내역, 채권자 목록\n통장 거래내역|최근 6개월~1년치 주거래 통장\n재산 관련 서류|부동산 등기부등본, 차량등록증 등 해당 자료\n압류 관련 서류|압류 통지서 또는 추심 관련 문자\n[[DOCS_END]]`;
  } else if (fieldName === '개인파산') {

  }

  return `[[SUMMARY_START]]\n${summary}\n[[SUMMARY_END]]\n[[ANALYSIS_START]]\nSTARS|${stars}\nGRADE|${grade}\nOPINION|${opinion}\nCHECK|${check}\n[[ANALYSIS_END]]${docs}`;
}

async function callClaudePreview(userMessage) {
  await new Promise(r => setTimeout(r, 500));

  if (previewTimeStep) {
    previewTimeStep = false;
    return `접수가 완료되었습니다.\n\n상담 가능 시간은 '${userMessage}'으로 접수되었습니다.\n담당자가 순차적으로 연락드리겠습니다.\n\n우상법률사무소 ☎ 02-927-9665\n\n다른 분야로 추가 상담이 필요하시면 아래에서 분야를 선택해주세요.`;
  }

  if (previewCurrentField === null) {
    const t = userMessage.replace(/\s/g, '');
    let detected = null;
    if (t.includes('개인회생') || t === '1' || t === '①') detected = '개인회생';
    else if (t.includes('개인파산') || t.includes('파산') || t === '2' || t === '②') detected = '개인파산';
    else if (t.includes('민사') || t === '3' || t === '③') detected = '민사';
    else if (t.includes('형사') || t === '4' || t === '④') detected = '형사';
    else if (t.includes('이혼') || t.includes('가사') || t === '5' || t === '⑤') detected = '이혼·가사';

    if (detected) {
      previewCurrentField = detected;
      previewStep = 0;
      previewPhoneStep = false;
      previewAnswers = [];
      const field = PREVIEW_FIELDS[previewCurrentField];
      const firstChoices = field.choices && field.choices[0];
      const firstChoicesTag = firstChoices ? `\n[[CHOICES:${firstChoices.join('|')}]]` : '';
      return `${previewCurrentField} 상담을 선택하셨군요. 몇 가지 여쭤보겠습니다.\n\n${field.questions[0]}${firstChoicesTag}`;
    }

    if (previewPhoneStep) {
      previewPhoneStep = false;
      const t2 = userMessage.trim();
      if (t2.includes('네') || t2.includes('원') || t2.includes('예') || t2.includes('yes') || t2.includes('ㅇ')) {
        previewTimeStep = true;
        return '감사합니다. 담당 변호사가 연락드릴 수 있도록 접수하겠습니다.\n\n상담 가능 시간대를 선택해주세요.\n[[CHOICES:오전 가능|오후 가능|아무 때나 가능]]';
      } else {
        return '알겠습니다. 언제든 추가 상담이 필요하시면 다시 찾아주세요.\n\n우상법률사무소 ☎ 02-927-9665';
      }
    }

    return '죄송합니다, 분야를 다시 선택해주시겠어요?\n① 개인회생 ② 개인파산 ③ 민사 ④ 형사 ⑤ 이혼·가사';
  }

  const field = PREVIEW_FIELDS[previewCurrentField];

  if (previewStep >= field.questions.length - 1) {
    const phone = userMessage.replace(/[-\s]/g, '');

    if (userMessage.trim() === '' || userMessage.includes('건너') || userMessage.includes('skip') || userMessage.includes('없음') || userMessage.includes('비공개')) {
      return '연락처를 입력하지 않으시면 상담 결과를 제공해드리기 어렵습니다.\n\n변호사가 직접 연락드리기 위해 연락처가 필요합니다. 전화번호를 입력해주시겠어요?';
    }

    if (!/^[0-9]{10,11}$/.test(phone)) {
      return '올바른 전화번호 형식이 아닌 것 같습니다.\n\n숫자만 입력해주세요. (예: 01012345678)';
    }

    previewAnswers[previewStep] = userMessage;
    const completedFieldName = previewCurrentField;
    const result = buildPreviewResult(completedFieldName, field, userMessage);
    previewCurrentField = null;
    previewStep = -1;
    previewPhoneStep = true;
    previewTimeStep = false;
    return result + '\n\n[[PHONE_QUESTION]]';
  }

  previewAnswers[previewStep] = userMessage;
  previewStep++;
  const reactions = ['네, 확인했습니다.', '그러셨군요.', '말씀해주셔서 감사합니다.', '잘 알겠습니다.'];
  const reaction = reactions[previewStep % reactions.length];
  const nextQ = field.questions[previewStep];
  const nextChoices = field.choices && field.choices[previewStep];
  const choicesTag = nextChoices ? `\n[[CHOICES:${nextChoices.join('|')}]]` : '';
  return `${reaction}\n\n${nextQ}${choicesTag}`;
}

async function callClaude(userMessage) {
  messages.push({ role: 'user', content: userMessage });
  const reply = await callClaudePreview(userMessage);
  messages.push({ role: 'assistant', content: reply });
  return reply;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  if (PREVIEW_MODE && previewCurrentField !== null && text.length < 2) {
    input.style.borderColor = 'var(--gold)';
    input.placeholder = '좀 더 자세히 입력해주세요 (2글자 이상)';
    setTimeout(() => {
      input.style.borderColor = '';
      input.placeholder = '메시지를 입력하세요...';
    }, 2000);
    return;
  }

  document.getElementById('choices')?.remove();
  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', text);
  showTyping();

  try {
    const reply = await callClaude(text);
    removeTyping();

    const choicesMatch = reply.match(/\[\[CHOICES:([^\]]+)\]\]/);
    const hasPhoneQ = reply.includes('[[PHONE_QUESTION]]');
    const hasPrivacyNotice = reply.includes('[[PRIVACY_NOTICE]]');
    let cleanReply = reply
      .replace(/\n\[\[CHOICES:[^\]]+\]\]/g, '')
      .replace(/\[\[CHOICES:[^\]]+\]\]/g, '')
      .replace('\n\n[[PHONE_QUESTION]]', '')
      .replace('[[PHONE_QUESTION]]', '')
      .replace('\n[[PRIVACY_NOTICE]]', '')
      .replace('[[PRIVACY_NOTICE]]', '');

    const rendered = renderResultCards(cleanReply);
    if (!rendered) {
      addMessage('bot', cleanReply);
    }

    if (hasPrivacyNotice) {
      addPrivacyNotice();
    }

    if (choicesMatch) {
      const choiceList = choicesMatch[1].split('|');
      addChoices(choiceList, true);
    } else if (!hasPhoneQ && !rendered) {
      const input = document.getElementById('userInput');
      input.disabled = false;
      input.placeholder = '메시지를 입력하세요...';
      input.style.opacity = '1';
      document.getElementById('sendBtn').disabled = false;
    }

    if (hasPhoneQ) {
      setTimeout(() => {
        addMessage('bot', '위 검토 결과를 바탕으로 변호사와 무료 전화 상담을 원하시나요?');
        addChoices(['네, 연락 주세요', '아니요, 괜찮습니다']);
      }, 400);
    }

    const isTimeResponse = (text === '오전 가능' || text === '오후 가능' || text === '아무 때나 가능');
    if (text === '아니요, 괜찮습니다' || isTimeResponse) {
      setTimeout(() => {
        addChoices(['① 개인회생', '② 개인파산', '③ 민사', '④ 형사', '⑤ 이혼·가사']);
      }, 800);
    }

  } catch (e) {
    removeTyping();
    addMessage('bot', '일시적인 오류가 발생했습니다. 잠시 후 다시 시도해주세요.\n전화 상담: 02-927-9665');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
}

async function init() {
  addMessage('bot', '안녕하세요.\n우상법률사무소 AI 상담원입니다.\n\n아래 분야를 클릭하시면 바로 상담을 시작할 수 있습니다 👇');
  addChoices(['① 개인회생', '② 개인파산', '③ 민사', '④ 형사', '⑤ 이혼·가사']);
}

init();
